<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen Test Runner — Suíte de QA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0b0f19;
      --bg-sidebar: #111827;
      --bg-card: rgba(30, 41, 59, 0.4);
      --border-color: rgba(71, 85, 105, 0.2);
      --color-pass: #10b981;
      --color-fail: #ef4444;
      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding: 40px 20px;
      min-height: 100vh;
    }
    h1, h2, h3 { font-family: 'Outfit', sans-serif; font-weight: 600; }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 28px; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      background: var(--bg-card);
      transition: 0.2s ease;
    }
    .back-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }
    /* Stats panel */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-val {
      font-size: 40px;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      margin-top: 8px;
    }
    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .stat-pass { color: var(--color-pass); }
    .stat-fail { color: var(--color-fail); }

    /* Progress bar */
    .progress-container {
      background: var(--border-color);
      height: 6px;
      border-radius: 3px;
      margin-bottom: 32px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--color-pass);
      transition: width 0.4s ease;
    }
    .progress-bar.has-failed {
      background: var(--color-fail);
    }

    /* Test list styles */
    .test-suite-card {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .suite-title {
      font-size: 18px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }
    .test-case {
      border: 1px solid var(--border-color);
      background: rgba(15,23,42,0.3);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .test-case-header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s ease;
    }
    .test-case-header:hover {
      background: rgba(15,23,42,0.5);
    }
    .test-status-pill {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .pill-pass {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--color-pass);
    }
    .pill-fail {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--color-fail);
    }
    .test-case-details {
      padding: 18px;
      background: var(--bg-base);
      border-top: 1px solid var(--border-color);
      font-size: 13px;
      font-family: monospace;
      color: var(--text-secondary);
      line-height: 1.6;
      display: none;
    }
    .test-case.expanded .test-case-details {
      display: block;
    }
    .assertion-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .assertion-line.fail {
      color: var(--color-fail);
    }
    .assertion-line.pass {
      color: var(--text-secondary);
    }
    .assertion-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-pass { background-color: var(--color-pass); }
    .dot-fail { background-color: var(--color-fail); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Suíte de QA & Testes</h1>
        <p style="color: var(--text-muted); font-size:14px; margin-top:4px;">Validação integrada de regras de negócio, versionamento e rollback</p>
      </div>
      <a href="index.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Voltar para o Lumen
      </a>
    </header>

    <!-- Stats row -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total de Testes</div>
        <div class="stat-val" id="total-val">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Passaram</div>
        <div class="stat-val stat-pass" id="pass-val">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Falharam</div>
        <div class="stat-val stat-fail" id="fail-val">0</div>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Suite Listings -->
    <div class="test-suite-card">
      <h3 class="suite-title">Resultados das Asserções</h3>
      <div id="test-list-body">
        <!-- Rendered dynamically -->
        <div style="text-align: center; color: var(--text-muted); padding: 20px;">Carregando testes...</div>
      </div>
    </div>
  </div>

  <!-- App Core Scripts -->
  <script src="src/domain/FinancialEngine.js"></script>
  <script src="src/domain/Account.js"></script>
  <script src="src/domain/Category.js"></script>
  <script src="src/domain/Transaction.js"></script>
  <script src="src/domain/Scenario.js"></script>
  <script src="src/domain/ScenarioItem.js"></script>
  <script src="src/infrastructure/Storage.js"></script>
  <script src="src/infrastructure/CsvParser.js"></script>
  <script src="src/application/LumenApp.js"></script>
  <script src="src/ui/AiPage.js"></script>
  <!-- Test Suite -->
  <script src="tests.js"></script>
</body>
</html>
